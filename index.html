<!doctype html>
<html lang="en">

    <meta name="apple-mobile-web-app-capable" content="yes" />

    <!-- Content Security Policy -->

    <!-- Primary Meta Tags -->
    <title>Slow Pour — Specialty Coffee & Table Dining</title>
    <meta name="title" content="Slow Pour — Specialty Coffee & Table Dining" />
    <meta name="description" content="Thoughtfully roasted single-origin coffees, fresh artisanal bakes, and seamless table ordering." />
    
    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://coffee-shop-np.vercel.app/" />
    <meta property="og:title" content="Slow Pour — Specialty Coffee & Table Dining" />

    <meta property="twitter:card" content="summary_large_image" />

    <!-- Fonts: Fraunces (display serif) + Instrument Sans (body sans) -->
